<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>echa event log renderer benchmark</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">echa measurement tools</p>
      <h1>Event log renderer benchmark</h1>
      <p>
        実際の描画fixtureからevent logを生成し、Canvasへのcold replay時間と
        メインスレッドの停止時間を測定します。
      </p>
    </header>

    <section class="controls" aria-label="測定条件">
      <label>
        Event数
        <input id="eventCount" type="number" min="10" step="1000" value="10000">
      </label>
      <label>
        同時actor数
        <input id="actorCount" type="number" min="1" max="20" value="3">
      </label>
      <label>
        Yield budget
        <span class="input-with-unit">
          <input id="yieldBudget" type="number" min="1" max="50" value="8">
          <span>ms</span>
        </span>
      </label>
      <label>
        Fixture JSON
        <input id="fixtureFile" type="file" accept=".json,application/json">
      </label>
      <div class="preset-row" aria-label="プリセット">
        <button type="button" data-events="1000">1,000</button>
        <button type="button" data-events="10000">10,000</button>
        <button type="button" data-events="50000">50,000</button>
        <button type="button" data-events="100000">100,000</button>
      </div>
      <div class="action-row">
        <button type="button" class="primary" id="runButton">測定する</button>
        <button type="button" id="exportButton" disabled>結果を書き出す</button>
      </div>
      <p id="status" role="status">準備完了</p>
    </section>

    <section class="canvas-section">
      <div class="canvas-shell">
        <canvas id="benchmarkCanvas" width="960" height="640"></canvas>
      </div>
      <dl class="current-result" id="currentResult">
        <div><dt>Replay</dt><dd>—</dd></div>
        <div><dt>First drawing</dt><dd>—</dd></div>
        <div><dt>Max slice</dt><dd>—</dd></div>
        <div><dt>Long tasks</dt><dd>—</dd></div>
      </dl>
    </section>

    <section>
      <h2>測定履歴</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Events</th>
              <th>Strokes</th>
              <th>Points</th>
              <th>Replay</th>
              <th>First</th>
              <th>Max slice</th>
              <th>Long tasks</th>
              <th>Est. wire</th>
            </tr>
          </thead>
          <tbody id="resultsBody">
            <tr><td colspan="8">まだ測定していません。</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="./benchmark.js"></script>
</body>
</html>
