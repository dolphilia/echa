<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はじめる — echanotes</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 30px;
    background:
      radial-gradient(rgba(55, 55, 50, 0.06) 1.5px, transparent 1.5px) 0 0 / 26px 26px,
      var(--bg);
  }

  .auth-card {
    position: relative;
    width: min(430px, 100%);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow-pop);
    padding: 38px 36px 32px;
  }
  .auth-card .deco {
    position: absolute;
    pointer-events: none;
  }

  .auth-card .brand { justify-content: center; margin-bottom: 26px; font-size: 17px; }
  .auth-card h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .auth-card .sub {
    text-align: center;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
    line-height: 1.9;
    margin-bottom: 28px;
  }

  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    height: 46px;
    padding: 0 16px;
    background: var(--bg);
    border: 1.5px solid var(--border-strong);
    border-radius: 15px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .field input::placeholder { color: var(--text-faint); font-weight: 500; }

  .color-row { display: flex; gap: 9px; justify-content: space-between; }
  .color-row button {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 3px solid transparent;
    transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
  }
  .color-row button:hover { transform: scale(1.12); }
  .color-row button.on {
    border-color: #fff;
    box-shadow: 0 0 0 2.5px var(--primary);
  }

  .btn.block { width: 100%; margin-top: 10px; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1.5px;
    background: var(--border);
    border-radius: 2px;
  }

  .sso { display: flex; flex-direction: column; gap: 10px; }
  .sso .btn { width: 100%; height: 44px; }

  .foot-note {
    margin-top: 24px;
    text-align: center;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-faint);
    line-height: 2;
  }
  .foot-note a { color: var(--primary-deep); font-weight: 700; }

  .back {
    position: fixed;
    top: 24px;
    left: 26px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-dim);
  }
  .back:hover { color: var(--text); }
</style>
</head>
<body>

<a class="back" href="../landing/">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  トップへ戻る
</a>

<div class="auth-card">
  <svg class="deco" style="top:-16px;right:32px" width="40" height="40" viewBox="0 0 44 44" fill="none">
    <path d="M22 6v8M22 30v8M6 22h8M30 22h8" stroke="#dfa94f" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <svg class="deco" style="bottom:-12px;left:-14px" width="44" height="30" viewBox="0 0 44 30" fill="none">
    <path d="M4 24 Q14 6 24 18 Q32 4 40 16" stroke="#7fc0c9" stroke-width="4" stroke-linecap="round"/>
  </svg>

  <a class="brand" href="../landing/"><span class="brand-mark">✎</span>echanotes</a>
  <h1>さっそく、はじめよう</h1>
  <p class="sub">ニックネームとカラーを決めるだけ。<br>登録なしでゲスト参加できます。</p>

  <div class="field">
    <label>ニックネーム</label>
    <input type="text" placeholder="例:はんざわ" maxlength="12">
  </div>

  <div class="field">
    <label>じぶんのカラー</label>
    <div class="color-row" id="colorRow">
      <button style="background:#7ba6c9" class="on"></button>
      <button style="background:#d38b8b"></button>
      <button style="background:#64a88b"></button>
      <button style="background:#dfa94f"></button>
      <button style="background:#7fc0c9"></button>
      <button style="background:#a08cc4"></button>
      <button style="background:#d3684f"></button>
    </div>
  </div>

  <a class="btn primary lg block" href="../rooms/">ゲストとしてはじめる</a>

  <div class="divider">アカウントをお持ちの方・作品を残したい方</div>

  <div class="sso">
    <button class="btn ghost">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Google で続ける
    </button>
    <button class="btn ghost">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.47l8.6-9.83L0 1.15h7.6l5.24 6.93zm-1.29 19.5h2.04L6.49 3.24H4.3z"/></svg>
      X で続ける
    </button>
    <button class="btn ghost">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-10 5L2 7"/></svg>
      メールアドレスで続ける
    </button>
  </div>

  <p class="foot-note">
    続行すると <a href="#">利用規約</a> と <a href="#">プライバシーポリシー</a> に<br>同意したものとみなされます。
  </p>
</div>

<script>
  document.querySelectorAll("#colorRow button").forEach((b) =>
    b.addEventListener("click", () => {
      document.querySelectorAll("#colorRow button").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
    })
  );
</script>
</body>
</html>
