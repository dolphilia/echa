<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=../rooms/">
<title>echanotes</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  body {
    display: grid;
    min-height: 100vh;
    place-items: center;
  }
  .redirect {
    padding: 28px;
    text-align: center;
    color: var(--text-dim);
  }
  .redirect .brand { justify-content: center; margin-bottom: 16px; }
  .redirect p { margin-bottom: 18px; font-size: 13px; }
</style>
<script>
  const destination = new URL("../rooms/", location.href);
  destination.search = location.search;
  destination.hash = location.hash;
  location.replace(destination);
</script>
</head>
<body>
  <main class="redirect">
    <a class="brand" href="../rooms/"><span class="brand-mark">✎</span>echanotes</a>
    <p>開催中のルームを読み込んでいます。</p>
    <a class="btn primary" href="../rooms/">ルームへ移動する</a>
  </main>
</body>
</html>
