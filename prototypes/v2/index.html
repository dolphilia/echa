<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>echanotes v2 — プロトタイプ一覧</title>
<link rel="stylesheet" href="shared/base.css">
<style>
  main { max-width: 720px; margin: 0 auto; padding: 60px 26px; }
  h1 { font-size: 23px; font-weight: 800; margin-bottom: 6px; }
  .sub { font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 34px; }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .item { display: flex; align-items: center; gap: 16px; padding: 18px 22px; }
  .item .icon {
    width: 46px; height: 46px;
    border-radius: 16px;
    display: grid; place-items: center;
    font-size: 20px;
    background: var(--bg-soft);
    flex-shrink: 0;
  }
  .item:nth-child(1) .icon { background: var(--anzu-soft); }
  .item:nth-child(2) .icon { background: var(--sky-soft); }
  .item:nth-child(3) .icon { background: var(--purin-soft); }
  .item:nth-child(4) .icon { background: var(--azuki-soft); }
  .item:nth-child(5) .icon { background: var(--primary-soft); }
  .item .txt { flex: 1; }
  .item b { font-size: 15px; font-weight: 800; }
  .item span { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--text-dim); }
  .item .arrow { color: var(--text-faint); font-weight: 800; }
</style>
</head>
<body>
<main>
  <div class="brand" style="margin-bottom:28px"><span class="brand-mark">✎</span>echanotes <span style="font-size:11px;font-weight:800;color:var(--anzu-deep);background:var(--anzu-soft);border-radius:999px;padding:3px 10px;margin-left:6px">v2 案</span></div>
  <h1>プロトタイプ一覧(v2)</h1>
  <p class="sub">白〜薄灰の無彩色ベース。主要アクションは緑、レトロ喫茶の差し色はサブに。紙色は「描く場所」だけに。</p>
  <div class="list">
    <a class="card item" href="landing/">
      <span class="icon">🏠</span>
      <span class="txt"><b>トップページ</b><span>サービス紹介・ランディングページ</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="card item" href="login/">
      <span class="icon">🚪</span>
      <span class="txt"><b>はじめる / ログイン</b><span>ゲスト参加を最優先にした認証画面</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="card item" href="rooms/">
      <span class="icon">🎪</span>
      <span class="txt"><b>ルーム一覧</b><span>開催中のお絵描きチャット一覧・ルーム作成モーダル</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="card item" href="drawing-room/">
      <span class="icon">🎨</span>
      <span class="txt"><b>お絵描きページ</b><span>共同キャンバス+チャット(実際に描けます)</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="card item" href="gallery/">
      <span class="icon">🖼️</span>
      <span class="txt"><b>ギャラリー</b><span>完成した合作作品のアーカイブ</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="card item" href="profile/">
      <span class="icon">👤</span>
      <span class="txt"><b>マイページ</b><span>プロフィール・作品・参加履歴</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="card item" href="help/">
      <span class="icon">💡</span>
      <span class="txt"><b>ヘルプ</b><span>はじめかたガイド・FAQ・ショートカット</span></span>
      <span class="arrow">→</span>
    </a>
  </div>
</main>
</body>
</html>
