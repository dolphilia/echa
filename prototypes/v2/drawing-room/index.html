<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>echanotes — らくがきルーム</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  html, body { height: 100%; overflow: hidden; }

  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 58px 1fr;
    width: 100%;
    min-width: 0;
    height: 100vh;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    overflow: hidden;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1.5px solid var(--border);
    z-index: 30;
  }
  .topbar .brand { font-size: 15px; }
  .topbar-divider { width: 1.5px; height: 24px; background: var(--border); border-radius: 2px; }
  .room-title { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .room-title .name { font-size: 14px; font-weight: 800; white-space: nowrap; }
  .room-title .status {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; color: var(--text-dim); white-space: nowrap;
  }
  .topbar .spacer { flex: 1; }
  .topbar .avatar { width: 30px; height: 30px; font-size: 11px; }
  .topbar .avatar-stack .avatar { border-color: var(--surface); }
  .topbar .btn { height: 36px; padding: 0 16px; font-size: 12.5px; }

  /* ── Main ── */
  .main {
    position: relative;
    display: flex;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  .workspace {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    background:
      radial-gradient(rgba(55, 55, 50, 0.09) 1.5px, transparent 1.5px) 0 0 / 24px 24px,
      var(--bg-soft);
    display: grid;
    place-items: center;
  }

  .artboard-wrap {
    position: relative;
    transform-origin: center;
    filter: drop-shadow(0 14px 30px rgba(55, 55, 50, 0.18)) drop-shadow(0 3px 8px rgba(55, 55, 50, 0.1));
  }
  #artboard,
  #strokePreview {
    display: block;
    border-radius: 10px;
    width: 960px;
    height: 640px;
  }
  #artboard {
    background: #fff;
    touch-action: none;
    cursor: crosshair;
  }
  #strokePreview {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }
  .workspace.eyedropper-active #artboard { cursor: none; }
  .workspace.zoom-active #artboard { cursor: zoom-in; }
  .workspace.zoom-scrubbing #artboard { cursor: ew-resize; }
  .workspace.pan-ready,
  .workspace.pan-ready #artboard { cursor: grab; }
  .workspace.panning,
  .workspace.panning #artboard { cursor: grabbing; }

  .eyedropper-cursor {
    --sampled-color: #fff;
    position: absolute;
    left: 0;
    top: 0;
    width: 120px;
    height: 120px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 24;
    filter: drop-shadow(0 4px 7px rgba(55, 55, 50, 0.32));
  }
  .eyedropper-cursor canvas {
    position: absolute;
    inset: 18px;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 1px rgba(55, 55, 50, 0.3);
    image-rendering: pixelated;
  }
  .eyedropper-ring {
    position: absolute;
    inset: 0;
    overflow: visible;
  }
  .eyedropper-ring path {
    fill: none;
    stroke-width: 18;
    stroke-linecap: butt;
  }
  .eyedropper-ring .ring-outline {
    fill: none;
    stroke: rgba(55, 55, 50, 0.55);
    stroke-width: 20;
  }
  .eyedropper-ring .sampled-half { stroke: var(--sampled-color); }
  .eyedropper-ring .current-half { stroke: var(--current-color); }
  .eyedropper-reticle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    transform: translate(-50%, -50%);
  }
  .eyedropper-reticle::before,
  .eyedropper-reticle::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    background: #161713;
    box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.9);
    transform: translate(-50%, -50%);
  }
  .eyedropper-reticle::before { width: 16px; height: 1px; }
  .eyedropper-reticle::after { width: 1px; height: 16px; }
  .eyedropper-reticle i {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #161713;
    transform: translate(-50%, -50%);
  }

  .remote-cursor {
    position: absolute;
    pointer-events: none;
    z-index: 5;
    transition: transform 2.8s cubic-bezier(0.45, 0, 0.25, 1);
  }
  .remote-cursor .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    box-shadow: 0 1px 4px rgba(55, 55, 50, 0.3);
  }
  .remote-cursor .tag {
    margin-top: 4px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(55, 55, 50, 0.25);
  }

  /* ── Tool rail ── */
  .tool-rail {
    position: absolute;
    left: 16px;
    top: 16px;
    display: flex;
    flex-direction: row;
    gap: 2px;
    padding: 5px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow-pop);
    z-index: 20;
  }
  .tool {
    width: 36px; height: 36px;
    border-radius: 12px;
    display: grid; place-items: center;
    color: var(--text-dim);
    transition: background 0.15s, color 0.15s;
    position: relative;
  }
  .tool:hover { background: var(--bg-soft); color: var(--text); }
  .tool.active { background: var(--primary-soft); color: var(--primary-deep); }
  .tool.active::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -5px;
    transform: translateX(-50%);
    width: 16px; height: 3px;
    border-radius: 4px;
    background: var(--primary);
  }
  .rail-divider {
    width: 1.5px;
    height: 20px;
    margin: 8px 3px;
    background: var(--border);
    border-radius: 2px;
  }

  .color-chip { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; }
  .color-chip .swatch {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--current-color, #574f43);
    border: 3px solid #fff;
    box-shadow: 0 0 0 1.5px var(--border-strong), 0 2px 5px rgba(55, 55, 50, 0.2);
    transition: background 0.15s;
  }

  /* ── Sliders ── */
  .slider-dock {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 9px 5px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow-pop);
    z-index: 19;
  }
  .v-slider {
    --slider-thumb-offset: 13px;
    position: relative;
    width: 32px;
    height: 112px;
    transition: opacity 0.15s;
  }
  .v-slider::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 4px;
    bottom: 4px;
    width: 6px;
    border-radius: 999px;
    background: #cfd1ce;
    transform: translateX(-50%);
  }
  .v-slider::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: var(--slider-thumb-offset);
    width: 16px;
    height: 16px;
    border: 1.5px solid #b8bab5;
    border-radius: 50%;
    background: #f7f7f5;
    box-shadow:
      0 2px 5px rgba(55, 55, 50, 0.17),
      0 0 0 1.5px rgba(255, 255, 255, 0.65);
    transform: translate(-50%, 50%);
    transition: bottom 0.04s linear, box-shadow 0.15s;
    pointer-events: none;
  }
  .v-slider:focus-within::after {
    border-color: #a7aaa4;
    box-shadow:
      0 2px 6px rgba(55, 55, 50, 0.17),
      0 0 0 2.5px rgba(255, 255, 255, 0.9);
  }
  .v-slider input[type="range"] {
    position: absolute;
    inset: 0;
    writing-mode: vertical-lr;
    direction: rtl;
    width: 32px;
    height: 112px;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    z-index: 1;
  }
  .v-slider.disabled { opacity: 0.35; }
  .v-slider.disabled input { cursor: not-allowed; }
  .slider-dock .tool.active::before {
    left: -8px;
    top: 50%;
    bottom: auto;
    transform: translateY(-50%);
    width: 4px;
    height: 18px;
  }
  .slider-dock .tool {
    width: 36px;
    height: 36px;
    background: transparent;
    border-color: transparent;
  }
  .slider-dock .tool:hover,
  .slider-dock .tool.active { background: transparent; }

  .slider-preview {
    position: absolute;
    width: 156px;
    padding: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow-pop);
    pointer-events: none;
    z-index: 23;
  }
  .slider-preview::before {
    content: "";
    position: absolute;
    left: -7px;
    top: 50%;
    width: 12px;
    height: 12px;
    background: var(--surface);
    border-left: 1.5px solid var(--border);
    border-bottom: 1.5px solid var(--border);
    transform: translateY(-50%) rotate(45deg);
  }
  .slider-preview-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 9px;
  }
  .slider-preview-header strong {
    font-size: 12px;
    font-weight: 800;
  }
  .slider-preview-header span {
    font-size: 11px;
    font-weight: 800;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .slider-preview-stage {
    height: 104px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: var(--bg);
  }
  .slider-preview-stage.opacity {
    background-color: #fff;
    background-image:
      linear-gradient(45deg, var(--border) 25%, transparent 25%),
      linear-gradient(-45deg, var(--border) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--border) 75%),
      linear-gradient(-45deg, transparent 75%, var(--border) 75%);
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    background-size: 12px 12px;
  }
  .slider-preview-dot {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--current-color);
    box-shadow: 0 2px 8px rgba(55, 55, 50, 0.25);
  }

  /* ── Color dialog ── */
  .palette {
    --picker-hue: 0;
    position: fixed;
    left: 84px;
    top: 146px;
    width: 292px;
    max-width: calc(100% - 100px);
    max-height: calc(100vh - 94px);
    padding: 13px;
    overflow-y: auto;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow-pop);
    z-index: 25;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity 0.18s, transform 0.18s;
  }
  .palette.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .picker-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 13px;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .palette.dragging .picker-header { cursor: grabbing; }
  .picker-header h3 { font-size: 16px; font-weight: 800; }
  .picker-current {
    width: 20px;
    height: 20px;
    margin-left: auto;
    border-radius: 50%;
    background: var(--current-color);
    border: 2px solid #fff;
    box-shadow: 0 0 0 1.5px var(--border-strong);
  }
  .picker-header .icon-btn { width: 28px; height: 28px; }
  .picker-panel { display: none; min-height: 252px; }
  .picker-panel.active { display: flex; }

  /* Circle picker */
  .circle-panel { align-items: center; justify-content: center; }
  .color-wheel {
    position: relative;
    width: min(238px, 100%);
    aspect-ratio: 1;
    border-radius: 50%;
    background: conic-gradient(from 90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
    box-shadow: inset 0 0 0 1px rgba(55, 55, 50, 0.12);
    cursor: crosshair;
    touch-action: none;
  }
  .color-wheel::before {
    content: "";
    position: absolute;
    inset: 25px;
    border-radius: 50%;
    background: var(--surface);
  }
  .circle-sv {
    position: absolute;
    inset: 56px;
    z-index: 1;
    border-radius: 3px;
    background:
      linear-gradient(to top, #000, transparent),
      linear-gradient(to right, #fff, hsl(var(--picker-hue), 100%, 50%));
    box-shadow: 0 2px 8px rgba(55, 55, 50, 0.28);
    cursor: crosshair;
    touch-action: none;
  }
  .picker-handle {
    position: absolute;
    width: 17px;
    height: 17px;
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 1px 5px rgba(30, 30, 26, 0.5), 0 0 0 1px rgba(30, 30, 26, 0.35);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .hue-handle {
    z-index: 2;
    width: 19px;
    height: 19px;
    background: hsl(var(--picker-hue), 100%, 50%);
  }

  /* Square picker */
  .square-panel { flex-direction: column; justify-content: center; gap: 16px; }
  .square-sv {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 14px;
    background:
      linear-gradient(to top, #000, transparent),
      linear-gradient(to right, #fff, hsl(var(--picker-hue), 100%, 50%));
    box-shadow: inset 0 0 0 1px rgba(55, 55, 50, 0.15);
    cursor: crosshair;
    touch-action: none;
  }
  .hue-range {
    appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
    cursor: pointer;
  }
  .hue-range::-webkit-slider-thumb,
  .channel-row input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--primary);
    box-shadow: 0 1px 4px rgba(55, 55, 50, 0.25);
  }

  /* Slider picker */
  .sliders-panel { flex-direction: column; gap: 10px; }
  .picker-mode-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 3px;
    background: var(--bg);
    border-radius: 12px;
  }
  .picker-mode-tabs button {
    height: 34px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 800;
    color: var(--text-dim);
  }
  .picker-mode-tabs button.active {
    color: var(--primary-deep);
    background: var(--primary-soft);
    box-shadow: 0 1px 3px rgba(55, 55, 50, 0.1);
  }
  .channel-group {
    display: none;
    flex-direction: column;
    gap: 7px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 14px;
  }
  .channel-group.active { display: flex; }
  .channel-row {
    display: grid;
    grid-template-columns: 18px 1fr 42px;
    align-items: center;
    gap: 9px;
    min-height: 33px;
  }
  .channel-row label { font-size: 12px; font-weight: 800; color: var(--text-dim); }
  .channel-row output {
    text-align: right;
    font-size: 11.5px;
    font-weight: 800;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .channel-row input[type="range"] {
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: var(--border-strong);
    cursor: pointer;
  }
  #hsbHue { background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  #hsbSaturation { background: linear-gradient(to right, #fff, hsl(var(--picker-hue), 100%, 50%)); }
  #hsbBrightness { background: linear-gradient(to right, #000, hsl(var(--picker-hue), 100%, 50%)); }
  #rgbRed { background: linear-gradient(to right, #000, #f00); }
  #rgbGreen { background: linear-gradient(to right, #000, #0f0); }
  #rgbBlue { background: linear-gradient(to right, #000, #00f); }
  .hex-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 14px;
  }
  .hex-row label { font-size: 12px; font-weight: 800; color: var(--text-dim); }
  .hex-row input {
    flex: 1;
    min-width: 0;
    height: 34px;
    padding: 0 10px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    font: 800 12px/1 inherit;
    text-transform: uppercase;
    outline: none;
  }
  .hex-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

  /* Saved palette */
  .saved-panel { flex-direction: column; gap: 10px; }
  .saved-palette-title {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 800;
    color: var(--text-faint);
    letter-spacing: 0.06em;
  }
  .saved-swatches {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    overflow: hidden;
    border: 1.5px solid var(--border);
    border-radius: 15px;
  }
  .saved-swatches button {
    aspect-ratio: 1;
    border-radius: 0;
    position: relative;
  }
  .saved-swatches button:hover { z-index: 1; box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.8); }
  .saved-swatches button.selected::after {
    content: "";
    position: absolute;
    inset: 7px;
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 1.5px rgba(55, 55, 50, 0.45);
  }

  /* Picker type tabs */
  .picker-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    margin-top: 12px;
    padding-top: 11px;
    border-top: 1.5px solid var(--border);
  }
  .picker-tabs button {
    height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: var(--text-faint);
  }
  .picker-tabs button:hover { background: var(--bg); color: var(--text-dim); }
  .picker-tabs button.active { color: var(--primary-deep); background: var(--primary-soft); }
  .picker-tabs svg { width: 21px; height: 21px; }

  @media (max-width: 560px) {
    .palette {
      left: 70px;
      width: 276px;
      max-width: calc(100% - 82px);
    }
    .picker-panel { min-height: 238px; }
    .circle-sv { inset: 54px; }
  }

  /* ── Zoom ── */
  .zoom-dock {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translate(-50%, 8px);
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 5px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow-soft);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition:
      opacity 0.16s ease,
      visibility 0.16s ease,
      transform 0.16s ease;
    z-index: 18;
  }
  .zoom-dock.visible {
    transform: translate(-50%, 0);
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  .zoom-dock .icon-btn { width: 30px; height: 30px; border-radius: 999px; }
  .zoom-dock .zoom-value {
    min-width: 48px; text-align: center;
    font-size: 12px; font-weight: 700; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }

  /* ── Chat ── */
  .chat {
    width: 320px;
    max-width: 100%;
    min-width: 0;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1.5px solid var(--border);
    transition: margin-right 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 22;
  }
  .chat.collapsed { margin-right: -320px; }

  .chat-header {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px;
    border-bottom: 1.5px solid var(--border);
  }
  .chat-header h2 { font-size: 13.5px; font-weight: 800; }
  .chat-header .online {
    font-size: 11.5px; font-weight: 600; color: var(--text-dim);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chat-header .spacer { flex: 1; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .msg { display: flex; gap: 9px; }
  .msg .avatar { width: 30px; height: 30px; font-size: 12px; }
  .msg .body { min-width: 0; }
  .msg .meta { display: flex; align-items: baseline; gap: 7px; margin-bottom: 2px; }
  .msg .meta .name { font-size: 12px; font-weight: 800; }
  .msg .meta .time { font-size: 10px; font-weight: 600; color: var(--text-faint); }
  .msg .text {
    display: inline-block;
    font-size: 12.5px;
    line-height: 1.7;
    background: var(--bg);
    border-radius: 4px 14px 14px 14px;
    padding: 7px 12px;
    word-break: break-word;
  }
  .msg.me .text { background: var(--primary-soft); }

  .msg-system {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-faint);
    padding: 2px 0;
  }
  .msg-system em { font-style: normal; color: var(--text-dim); font-weight: 800; }

  .typing {
    display: flex; align-items: center; gap: 8px;
    padding: 0 16px 8px;
    font-size: 11px; font-weight: 600; color: var(--text-faint);
    min-height: 20px;
  }
  .typing .dots { display: inline-flex; gap: 3px; }
  .typing .dots i {
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--text-faint);
    animation: bounce 1.2s infinite;
  }
  .typing .dots i:nth-child(2) { animation-delay: 0.15s; }
  .typing .dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 30% { transform: translateY(-4px); opacity: 1; } }

  .chat-input-area { padding: 10px 13px 14px; border-top: 1.5px solid var(--border); }
  .stamp-row { display: flex; gap: 5px; margin-bottom: 9px; }
  .stamp {
    height: 30px;
    padding: 0 11px;
    border-radius: 999px;
    background: var(--bg-soft);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-dim);
    transition: background 0.15s, transform 0.1s, color 0.15s;
  }
  .stamp:hover { background: var(--primary-soft); color: var(--primary-deep); transform: scale(1.08); }

  .chat-input {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--bg);
    border: 1.5px solid var(--border-strong);
    border-radius: 16px;
    padding: 9px 9px 9px 14px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .chat-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .chat-input textarea {
    flex: 1;
    background: none; border: none; outline: none; resize: none;
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    line-height: 1.6;
    max-height: 84px;
  }
  .chat-input textarea::placeholder { color: var(--text-faint); }
  .send-btn {
    width: 32px; height: 32px;
    border-radius: 11px;
    background: var(--primary);
    box-shadow: 0 2px 0 var(--primary-deep);
    color: #fff;
    display: grid; place-items: center;
    flex-shrink: 0;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .send-btn:active { transform: translateY(1.5px); box-shadow: 0 0.5px 0 var(--primary-deep); }

  .chat-toggle {
    position: absolute;
    right: 16px;
    top: 16px;
    z-index: 23;
    width: 42px; height: 42px;
    border-radius: 14px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow-soft);
    display: grid; place-items: center;
    color: var(--text-dim);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .chat-toggle.visible { opacity: 1; pointer-events: auto; }
  .chat-toggle:hover { color: var(--text); }
  .chat-toggle .badge-dot {
    position: absolute;
    top: -5px; right: -5px;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--primary);
    border: 2px solid var(--surface);
    color: #fff;
    font-size: 9.5px;
    font-weight: 800;
    display: grid; place-items: center;
  }

  .toast {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    padding: 9px 18px;
    background: var(--text);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    box-shadow: var(--shadow-pop);
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<script>
/* ════════ Drawing ════════ */
const canvas = document.getElementById("artboard");
const ctx = canvas.getContext("2d");
const strokePreview = document.getElementById("strokePreview");
const strokeCtx = strokePreview.getContext("2d");
const measurementRecorder = window.EchaMeasurementRecorder?.create({
  canvasWidth: canvas.width,
  canvasHeight: canvas.height,
  source: "prototypes/v2/drawing-room"
});
const eyedropperCursor = document.getElementById("eyedropperCursor");
const eyedropperPreview = document.getElementById("eyedropperPreview");
const eyedropperPreviewCtx = eyedropperPreview.getContext("2d");
eyedropperPreviewCtx.imageSmoothingEnabled = false;
ctx.lineCap = "round";
ctx.lineJoin = "round";
strokeCtx.lineCap = "round";
strokeCtx.lineJoin = "round";

const state = {
  tool: "brush",
  lastDrawingTool: "brush",
  color: "#574f43",
  size: 8,
  opacity: 1,
  drawing: false,
  points: [],
  activeStroke: null,
  strokeFrame: null,
  undoStack: [],
  redoStack: [],
  zoom: 1,
  panX: 0,
  panY: 0,
  zoomScrubbing: false,
  zoomPointerId: null,
  zoomStartX: 0,
  zoomStartValue: 1,
  zoomFocalX: 0,
  zoomFocalY: 0,
  spacePressed: false,
  panning: false,
  panPointerId: null,
  lastPointerX: 0,
  lastPointerY: 0,
};

(function initializeCanvas() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
})();

function snapshot() {
  state.undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (state.undoStack.length > 30) state.undoStack.shift();
  state.redoStack.length = 0;
}

function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height),
  };
}

function canvasColorAt(point) {
  const x = Math.min(canvas.width - 1, Math.max(0, Math.floor(point.x)));
  const y = Math.min(canvas.height - 1, Math.max(0, Math.floor(point.y)));
  const [red, green, blue] = ctx.getImageData(x, y, 1, 1).data;
  return "#" + [red, green, blue]
    .map((value) => value.toString(16).padStart(2, "0"))
    .join("");
}

function updateEyedropperPreview(e) {
  if (state.tool !== "eyedropper") {
    eyedropperCursor.hidden = true;
    return;
  }

  const point = canvasPos(e);
  const sampledColor = canvasColorAt(point);
  const workspaceRect = document.getElementById("workspace").getBoundingClientRect();
  const sampleSize = 11;
  const sourceX = clamp(Math.floor(point.x) - 5, 0, canvas.width - sampleSize);
  const sourceY = clamp(Math.floor(point.y) - 5, 0, canvas.height - sampleSize);

  eyedropperPreviewCtx.clearRect(0, 0, eyedropperPreview.width, eyedropperPreview.height);
  eyedropperPreviewCtx.drawImage(
    canvas,
    sourceX,
    sourceY,
    sampleSize,
    sampleSize,
    0,
    0,
    eyedropperPreview.width,
    eyedropperPreview.height
  );

  eyedropperCursor.style.left = e.clientX - workspaceRect.left + "px";
  eyedropperCursor.style.top = e.clientY - workspaceRect.top + "px";
  eyedropperCursor.style.setProperty("--sampled-color", sampledColor);
  eyedropperCursor.hidden = false;
}

canvas.addEventListener("pointermove", updateEyedropperPreview);
canvas.addEventListener("pointerleave", () => {
  eyedropperCursor.hidden = true;
});

function appendStrokePoint(point) {
  const last = state.points[state.points.length - 1];
  if (last && Math.hypot(point.x - last.x, point.y - last.y) < 0.25) return;
  state.points.push(point);
}

function drawStrokePath(context, points, stroke) {
  if (!points.length) return;

  const lineWidth = stroke.tool === "eraser" ? stroke.size * 2.2 : stroke.size;
  context.lineWidth = lineWidth;
  context.strokeStyle = stroke.tool === "eraser" ? "#fff" : stroke.color;
  context.fillStyle = context.strokeStyle;

  if (points.length === 1) {
    context.beginPath();
    context.arc(points[0].x, points[0].y, lineWidth / 2, 0, Math.PI * 2);
    context.fill();
    return;
  }

  context.beginPath();
  context.moveTo(points[0].x, points[0].y);
  if (points.length === 2) {
    context.lineTo(points[1].x, points[1].y);
  } else {
    for (let index = 1; index < points.length - 1; index++) {
      const point = points[index];
      const next = points[index + 1];
      context.quadraticCurveTo(
        point.x,
        point.y,
        (point.x + next.x) / 2,
        (point.y + next.y) / 2
      );
    }
    const previous = points[points.length - 2];
    const last = points[points.length - 1];
    context.quadraticCurveTo(previous.x, previous.y, last.x, last.y);
  }
  context.stroke();
}

function renderStrokePreview() {
  state.strokeFrame = null;
  strokeCtx.clearRect(0, 0, strokePreview.width, strokePreview.height);
  if (!state.drawing || !state.activeStroke) return;

  strokeCtx.save();
  strokeCtx.globalAlpha = 1;
  drawStrokePath(strokeCtx, state.points, state.activeStroke);
  strokeCtx.restore();
  strokePreview.style.opacity = String(
    state.activeStroke.tool === "eraser" ? 1 : state.activeStroke.opacity
  );
}

function scheduleStrokePreview() {
  if (state.strokeFrame !== null) return;
  state.strokeFrame = requestAnimationFrame(renderStrokePreview);
}

function finishStroke() {
  if (!state.drawing || !state.activeStroke) return;

  if (state.strokeFrame !== null) {
    cancelAnimationFrame(state.strokeFrame);
    state.strokeFrame = null;
  }
  renderStrokePreview();

  ctx.save();
  ctx.globalAlpha = state.activeStroke.tool === "eraser"
    ? 1
    : state.activeStroke.opacity;
  ctx.drawImage(strokePreview, 0, 0);
  ctx.restore();

  strokeCtx.clearRect(0, 0, strokePreview.width, strokePreview.height);
  strokePreview.style.opacity = "1";
  state.drawing = false;
  state.points = [];
  state.activeStroke = null;
}

canvas.addEventListener("pointerdown", (e) => {
  if (state.spacePressed) return;

  const point = canvasPos(e);

  if (state.tool === "zoom") {
    if (e.button === 0) startZoomScrub(e);
    return;
  }

  if (state.tool === "eyedropper") {
    setColor(canvasColorAt(point));
    document.querySelector(`.tool[data-tool="${state.lastDrawingTool}"]`)?.click();
    return;
  }

  canvas.setPointerCapture(e.pointerId);
  snapshot();
  state.drawing = true;
  state.points = [point];
  state.activeStroke = {
    tool: state.tool,
    color: state.color,
    size: state.size,
    opacity: state.opacity,
  };
  measurementRecorder?.beginStroke(state.activeStroke, point, e.timeStamp);
  renderStrokePreview();
});

canvas.addEventListener("pointermove", (e) => {
  if (!state.drawing) return;
  const events = typeof e.getCoalescedEvents === "function"
    ? e.getCoalescedEvents()
    : [e];
  const points = events.map((event) => canvasPos(event));
  points.forEach(appendStrokePoint);
  measurementRecorder?.appendPoints(
    points.map((point, index) => ({
      ...point,
      capturedAt: events[index].timeStamp,
    }))
  );
  scheduleStrokePreview();
});

window.addEventListener("pointerup", (e) => {
  if (!state.drawing) return;
  const point = canvasPos(e);
  appendStrokePoint(point);
  measurementRecorder?.endStroke(point, e.timeStamp);
  finishStroke();
});
window.addEventListener("pointercancel", () => {
  measurementRecorder?.cancelStroke();
  finishStroke();
});

function undo() {
  if (!state.undoStack.length) return;
  state.redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  ctx.putImageData(state.undoStack.pop(), 0, 0);
}
function redo() {
  if (!state.redoStack.length) return;
  state.undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  ctx.putImageData(state.redoStack.pop(), 0, 0);
}
document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("redoBtn").addEventListener("click", redo);
window.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  }
});

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function hsvToRgb(h, s, v) {
  const hue = ((h % 360) + 360) % 360;
  const saturation = s / 100;
  const brightness = v / 100;
  const chroma = brightness * saturation;
  const x = chroma * (1 - Math.abs((hue / 60) % 2 - 1));
  const m = brightness - chroma;
  let red = 0;
  let green = 0;
  let blue = 0;

  if (hue < 60) [red, green, blue] = [chroma, x, 0];
  else if (hue < 120) [red, green, blue] = [x, chroma, 0];
  else if (hue < 180) [red, green, blue] = [0, chroma, x];
  else if (hue < 240) [red, green, blue] = [0, x, chroma];
  else if (hue < 300) [red, green, blue] = [x, 0, chroma];
  else [red, green, blue] = [chroma, 0, x];

  return {
    r: Math.round((red + m) * 255),
    g: Math.round((green + m) * 255),
    b: Math.round((blue + m) * 255),
  };
}

function rgbToHsv(r, g, b) {
  const red = r / 255;
  const green = g / 255;
  const blue = b / 255;
  const max = Math.max(red, green, blue);
  const min = Math.min(red, green, blue);
  const delta = max - min;
  let hue = 0;

  if (delta) {
    if (max === red) hue = 60 * (((green - blue) / delta) % 6);
    else if (max === green) hue = 60 * ((blue - red) / delta + 2);
    else hue = 60 * ((red - green) / delta + 4);
  }
  if (hue < 0) hue += 360;

  return {
    h: hue,
    s: max === 0 ? 0 : delta / max * 100,
    v: max * 100,
  };
}

function rgbToHex({ r, g, b }) {
  return "#" + [r, g, b]
    .map((value) => Math.round(value).toString(16).padStart(2, "0"))
    .join("")
    .toUpperCase();
}

function hexToRgb(color) {
  const match = color.trim().match(/^#?([0-9a-f]{6})$/i);
  if (!match) return null;
  const value = match[1];
  return {
    r: parseInt(value.slice(0, 2), 16),
    g: parseInt(value.slice(2, 4), 16),
    b: parseInt(value.slice(4, 6), 16),
  };
}

function syncPickerUi() {
  const rgb = hsvToRgb(picker.h, picker.s, picker.v);
  const hex = rgbToHex(rgb);
  const hueRadians = picker.h * Math.PI / 180;

  state.color = hex;
  document.documentElement.style.setProperty("--current-color", hex);
  paletteEl.style.setProperty("--picker-hue", picker.h);

  document.getElementById("circleHueHandle").style.left = 50 + Math.cos(hueRadians) * 43 + "%";
  document.getElementById("circleHueHandle").style.top = 50 + Math.sin(hueRadians) * 43 + "%";
  document.getElementById("circleSvHandle").style.left = picker.s + "%";
  document.getElementById("circleSvHandle").style.top = 100 - picker.v + "%";
  document.getElementById("squareSvHandle").style.left = picker.s + "%";
  document.getElementById("squareSvHandle").style.top = 100 - picker.v + "%";

  document.getElementById("squareHue").value = picker.h;
  document.getElementById("hsbHue").value = picker.h;
  document.getElementById("hsbSaturation").value = picker.s;
  document.getElementById("hsbBrightness").value = picker.v;
  document.getElementById("hsbHueValue").textContent = Math.round(picker.h) + "°";
  document.getElementById("hsbSaturationValue").textContent = Math.round(picker.s) + "%";
  document.getElementById("hsbBrightnessValue").textContent = Math.round(picker.v) + "%";

  document.getElementById("rgbRed").value = rgb.r;
  document.getElementById("rgbGreen").value = rgb.g;
  document.getElementById("rgbBlue").value = rgb.b;
  document.getElementById("rgbRedValue").textContent = rgb.r;
  document.getElementById("rgbGreenValue").textContent = rgb.g;
  document.getElementById("rgbBlueValue").textContent = rgb.b;
  document.getElementById("hexColor").value = hex;

  savedSwatches.querySelectorAll("button").forEach((button) => {
    button.classList.toggle("selected", button.dataset.color.toUpperCase() === hex);
  });
}

function setPickerHsv(h, s, v) {
  picker.h = clamp(h, 0, 360);
  picker.s = clamp(s, 0, 100);
  picker.v = clamp(v, 0, 100);
  syncPickerUi();
}

function setColor(color) {
  const rgb = hexToRgb(color);
  if (!rgb) return;
  const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
  setPickerHsv(hsv.h, hsv.s, hsv.v);
}

function bindPickerDrag(element, update) {
  let pointerId = null;
  element.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    pointerId = e.pointerId;
    element.setPointerCapture(pointerId);
    update(e);
  });
  element.addEventListener("pointermove", (e) => {
    if (e.pointerId === pointerId) update(e);
  });
  const finish = (e) => {
    if (e.pointerId === pointerId) pointerId = null;
  };
  element.addEventListener("pointerup", finish);
  element.addEventListener("pointercancel", finish);
}

bindPickerDrag(colorWheel, (e) => {
  if (e.type === "pointerdown" && e.target !== colorWheel) return;
  const rect = colorWheel.getBoundingClientRect();
  const x = e.clientX - (rect.left + rect.width / 2);
  const y = e.clientY - (rect.top + rect.height / 2);
  const hue = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  setPickerHsv(hue, picker.s, picker.v);
});

function updateSvFromPointer(element, e) {
  const rect = element.getBoundingClientRect();
  const saturation = clamp((e.clientX - rect.left) / rect.width, 0, 1) * 100;
  const brightness = (1 - clamp((e.clientY - rect.top) / rect.height, 0, 1)) * 100;
  setPickerHsv(picker.h, saturation, brightness);
}

function setPaletteOpen(open) {
  paletteEl.classList.toggle("open", open);
  paletteEl.setAttribute("aria-hidden", String(!open));
  paletteEl.inert = !open;
  if (open) constrainPalettePosition();
}

function constrainPalettePosition() {
  const rect = paletteEl.getBoundingClientRect();
  const styles = getComputedStyle(paletteEl);
  const currentLeft = parseFloat(paletteEl.style.left || styles.left);
  const currentTop = parseFloat(paletteEl.style.top || styles.top);
  const margin = 8;
  const left = clamp(currentLeft, margin, Math.max(margin, window.innerWidth - rect.width - margin));
  const top = clamp(currentTop, margin, Math.max(margin, window.innerHeight - rect.height - margin));
  paletteEl.style.left = left + "px";
  paletteEl.style.top = top + "px";
}

const pickerHeader = paletteEl.querySelector(".picker-header");
let paletteDrag = null;

pickerHeader.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || e.target.closest("button")) return;
  e.preventDefault();
  const rect = paletteEl.getBoundingClientRect();
  paletteDrag = {
    pointerId: e.pointerId,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
  };
  pickerHeader.setPointerCapture(e.pointerId);
  paletteEl.classList.add("dragging");
});

window.addEventListener("pointermove", (e) => {
  if (!paletteDrag || e.pointerId !== paletteDrag.pointerId) return;
  const rect = paletteEl.getBoundingClientRect();
  const margin = 8;
  const left = clamp(
    e.clientX - paletteDrag.offsetX,
    margin,
    Math.max(margin, window.innerWidth - rect.width - margin)
  );
  const top = clamp(
    e.clientY - paletteDrag.offsetY,
    margin,
    Math.max(margin, window.innerHeight - rect.height - margin)
  );
  paletteEl.style.left = left + "px";
  paletteEl.style.top = top + "px";
});

function stopPaletteDrag(e) {
  if (!paletteDrag || e.pointerId !== paletteDrag.pointerId) return;
  paletteDrag = null;
  paletteEl.classList.remove("dragging");
}
window.addEventListener("pointerup", stopPaletteDrag);
window.addEventListener("pointercancel", stopPaletteDrag);
window.addEventListener("resize", constrainPalettePosition);

colorChip.addEventListener("click", (e) => {
  e.stopPropagation();
  setPaletteOpen(!paletteEl.classList.contains("open"));
});
document.getElementById("paletteClose").addEventListener("click", () =>
  setPaletteOpen(false)
);

/* ════════ Pan & Zoom ════════ */
const wrap = document.getElementById("artboardWrap");
const workspace = document.getElementById("workspace");

function setZoomDockVisible(visible) {
  zoomDock.classList.toggle("visible", visible);
  zoomDock.setAttribute("aria-hidden", String(!visible));
  if (visible) {
    zoomDock.removeAttribute("inert");
  } else {
    zoomDock.setAttribute("inert", "");
  }
}

function syncZoomDockForTool() {
  clearTimeout(zoomDockHideTimer);
  zoomDockHideTimer = null;
  setZoomDockVisible(state.tool === "zoom");
}

function showZoomDockForActivity() {
  clearTimeout(zoomDockHideTimer);
  zoomDockHideTimer = null;
  setZoomDockVisible(true);
  if (state.tool === "zoom") return;
  zoomDockHideTimer = setTimeout(() => {
    setZoomDockVisible(false);
    zoomDockHideTimer = null;
  }, 900);
}

function applyViewportTransform() {
  wrap.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
  document.getElementById("zoomValue").textContent = Math.round(state.zoom * 100) + "%";
}

function setZoom(nextZoom, focalPoint = null) {
  const previousZoom = state.zoom;
  const clampedZoom = Math.min(2, Math.max(0.4, nextZoom));
  if (clampedZoom === previousZoom) return;

  if (focalPoint) {
    const rect = wrap.getBoundingClientRect();
    const ratio = clampedZoom / previousZoom;
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    state.panX += (focalPoint.x - centerX) * (1 - ratio);
    state.panY += (focalPoint.y - centerY) * (1 - ratio);
  }

  state.zoom = clampedZoom;
  applyViewportTransform();
  showZoomDockForActivity();
}

function startZoomScrub(e) {
  e.preventDefault();
  state.zoomScrubbing = true;
  state.zoomPointerId = e.pointerId;
  state.zoomStartX = e.clientX;
  state.zoomStartValue = state.zoom;
  state.zoomFocalX = e.clientX;
  state.zoomFocalY = e.clientY;
  workspace.classList.add("zoom-scrubbing");
  canvas.setPointerCapture(e.pointerId);
}

function updateZoomScrub(e) {
  if (!state.zoomScrubbing || e.pointerId !== state.zoomPointerId) return;
  const distance = e.clientX - state.zoomStartX;
  const nextZoom = state.zoomStartValue * Math.exp(distance * 0.0045);
  setZoom(nextZoom, { x: state.zoomFocalX, y: state.zoomFocalY });
}

function stopZoomScrub(e = null) {
  if (!state.zoomScrubbing) return;
  if (e && e.pointerId !== state.zoomPointerId) return;
  const pointerId = state.zoomPointerId;
  state.zoomScrubbing = false;
  state.zoomPointerId = null;
  workspace.classList.remove("zoom-scrubbing");
  if (pointerId !== null && canvas.hasPointerCapture(pointerId)) {
    canvas.releasePointerCapture(pointerId);
  }
}

function isTextInput(target) {
  return target instanceof Element &&
    Boolean(target.closest("input, textarea, select, button, [contenteditable='true']"));
}

function isWorkspaceControl(target) {
  return target instanceof Element &&
    Boolean(target.closest(".tool-rail, .slider-dock, .palette, .zoom-dock, .chat-toggle"));
}

function stopPanning() {
  const pointerId = state.panPointerId;
  state.panning = false;
  state.panPointerId = null;
  workspace.classList.remove("panning");
  if (pointerId !== null && workspace.hasPointerCapture(pointerId)) {
    workspace.releasePointerCapture(pointerId);
  }
}

window.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || isTextInput(e.target)) return;
  e.preventDefault();
  state.spacePressed = true;
  workspace.classList.add("pan-ready");
});

window.addEventListener("keyup", (e) => {
  if (e.code !== "Space") return;
  state.spacePressed = false;
  stopPanning();
  workspace.classList.remove("pan-ready");
});

window.addEventListener("blur", () => {
  state.spacePressed = false;
  stopZoomScrub();
  stopPanning();
  workspace.classList.remove("pan-ready");
});

workspace.addEventListener("pointerdown", (e) => {
  if (!state.spacePressed || e.button !== 0 || isWorkspaceControl(e.target)) return;
  e.preventDefault();
  state.panning = true;
  state.panPointerId = e.pointerId;
  state.lastPointerX = e.clientX;
  state.lastPointerY = e.clientY;
  workspace.classList.add("panning");
  workspace.setPointerCapture(e.pointerId);
});

window.addEventListener("pointermove", (e) => {
  updateZoomScrub(e);
  if (!state.panning || e.pointerId !== state.panPointerId) return;
  state.panX += e.clientX - state.lastPointerX;
  state.panY += e.clientY - state.lastPointerY;
  state.lastPointerX = e.clientX;
  state.lastPointerY = e.clientY;
  applyViewportTransform();
});

window.addEventListener("pointerup", (e) => {
  stopZoomScrub(e);
  if (!state.panning || e.pointerId !== state.panPointerId) return;
  stopPanning();
});
window.addEventListener("pointercancel", (e) => {
  stopZoomScrub(e);
  stopPanning();
});

workspace.addEventListener("wheel", (e) => {
  if (isWorkspaceControl(e.target)) return;
  e.preventDefault();
  const zoomFactor = Math.exp(-e.deltaY * 0.001);
  setZoom(state.zoom * zoomFactor, { x: e.clientX, y: e.clientY });
}, { passive: false });

document.getElementById("zoomIn").addEventListener("click", () => {
  setZoom(state.zoom + 0.1);
});
document.getElementById("zoomOut").addEventListener("click", () => {
  setZoom(state.zoom - 0.1);
});

/* ════════ Chat ════════ */
const chatPanel = document.getElementById("chatPanel");
const chatToggle = document.getElementById("chatToggle");
const chatBadge = document.getElementById("chatBadge");
const messages = document.getElementById("chatMessages");
const input = document.getElementById("chatInput");

document.getElementById("chatCollapse").addEventListener("click", () => {
  chatPanel.classList.add("collapsed");
  chatToggle.classList.add("visible");
});
chatToggle.addEventListener("click", () => {
  chatPanel.classList.remove("collapsed");
  chatToggle.classList.remove("visible");
  chatBadge.hidden = true;
  chatBadge.textContent = "0";
});

function timeNow() {
  const d = new Date();
  return `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
}

function addMessage({ name, color, nameColor, initial, text, me = false }) {
  const el = document.createElement("div");
  el.className = "msg" + (me ? " me" : "");
  el.innerHTML = `
    <div class="avatar" style="background:${color}">${initial}</div>
    <div class="body">
      <div class="meta">
        <span class="name" style="color:${nameColor || color}">${name}</span>
        <span class="time">${timeNow()}</span>
      </div>
      <div class="text"></div>
    </div>`;
  el.querySelector(".text").textContent = text;
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;

  if (!me && chatPanel.classList.contains("collapsed")) {
    chatBadge.hidden = false;
    chatBadge.textContent = String(+chatBadge.textContent + 1 || 1);
  }
}

function sendMessage(text) {
  const t = text.trim();
  if (!t) return;
  addMessage({ name: "はんざわ", color: "#7ba6c9", nameColor: "#5f8cb2", initial: "は", text: t, me: true });
  input.value = "";
  input.style.height = "auto";
}

document.getElementById("sendBtn").addEventListener("click", () => sendMessage(input.value));
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage(input.value);
  }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});
document.querySelectorAll(".stamp").forEach((b) =>
  b.addEventListener("click", () => sendMessage(b.dataset.stamp))
);

/* ════════ Mock presence ════════ */
const remoteCursor = document.getElementById("remoteCursor");
const typingEl = document.getElementById("typingIndicator");
const MOCK_REPLIES = [
  { name: "そらまめ", color: "#64a88b", nameColor: "#4d8f73", initial: "そ", text: "屋台の屋根、赤にしてみた!" },
  { name: "みかん", color: "#dfa94f", nameColor: "#b5852f", initial: "み", text: "打ち上げ花火いくよ〜🎇" },
  { name: "ゆきうさぎ", color: "#d38b8b", nameColor: "#c47676", initial: "ゆ", text: "金魚かわいい!!" },
];
let replyIndex = 0;

function mockActivity() {
  const x = canvas.clientWidth * (0.1 + Math.random() * 0.75);
  const y = canvas.clientHeight * (0.1 + Math.random() * 0.72);
  remoteCursor.style.transform = `translate(${x}px, ${y}px)`;

  if (Math.random() < 0.5 && replyIndex < MOCK_REPLIES.length) {
    const reply = MOCK_REPLIES[replyIndex++];
    document.getElementById("typingName").textContent = reply.name;
    typingEl.hidden = false;
    setTimeout(() => {
      typingEl.hidden = true;
      addMessage(reply);
    }, 2200);
  }
}
setInterval(mockActivity, 6000);
setTimeout(mockActivity, 2500);

/* ════════ Toast ════════ */
const toast = document.getElementById("toast");
function showToast(text) {
  toast.textContent = text;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2400);
}
document.getElementById("inviteBtn").addEventListener("click", () =>
  showToast("招待リンクをコピーしました ✂")
);
document.querySelector(".btn.ghost").addEventListener("click", () =>
  showToast("キャンバスを保存しました ✓")
);
